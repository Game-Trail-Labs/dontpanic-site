<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OG Image Template</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        }
        .og-image {
            width: 1200px;
            height: 630px;
            background: linear-gradient(180deg, #6EC5BE 0%, #4BA8A8 35%, #3A9199 65%, #2A6B72 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .app-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin-bottom: 32px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }
        .title {
            font-size: 72px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.15);
        }
        .subtitle {
            font-size: 26px;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            letter-spacing: 2px;
        }
        .url {
            position: absolute;
            bottom: 36px;
            font-size: 18px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="og-image">
        <img src="app-icon.png" alt="Don't Panic" class="app-icon">
        <div class="title">Don't Panic</div>
        <div class="subtitle">Panic & Anxiety Relief. In Your Pocket.</div>
        <div class="url">dont-panic-app.com</div>
    </div>
</body>
</html>
